const fixBook=b=>{b.pages=(b.pages&&b.pages.length?b.pages:[{}]).map(p=>({objs:p.objs||[],v:p.v||{x:0,y:0,z:1},pdf:p.pdf,tx:p.tx,bm:p.bm,u:[],r:[]}));b.pi=b.pi||0;b.bg=b.bg||BG[0];b.tpl=b.tpl||'plain';b.name=String(b.name||'Notebook')};

function addImg(file){const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{
 let w=i.naturalWidth,h=i.naturalHeight,s=Math.min(1,1600/Math.max(w,h)),src=fr.result;
 if(s<1||file.size>1.5e6){const c=mk('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);src=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9)}

const ready=p=>Promise.all([...p.objs.filter(o=>o.t==='i'),...(p.pdf?[p.pdf]:[])].map(o=>{const i=img(o);return i.complete?0:new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true})})}));
function shot(p){const bd=bounds(p.pdf?[...p.objs,{t:'i',x:0,y:0,w:p.pdf.w,h:p.pdf.h}]:p.objs),m=p.pdf?0:40,c=mk('canvas');let v,w,h;
 if(bd){const bw=bd[2]-bd[0]+2*m,bh=bd[3]-bd[1]+2*m,z=Math.min(2,4096/bw,4096/bh);w=Math.ceil(bw*z);h=Math.ceil(bh*z);v={x:(m-bd[0])*z,y:(m-bd[1])*z,z}}else{w=W;h=H;v={...p.v}}
 c.width=w;c.height=h;paint(c.getContext('2d'),v,w,h,1,p.objs,p.pdf);return c}

async function expPdf(){commitTx();const im=[];

function pdf(im){
 const en=new TextEncoder(),parts=[],off=[];let len=0;
 const add=x=>{const b=typeof x==='string'?en.encode(x):x;parts.push(b);len+=b.length},ob=(n,s)=>{off[n]=len;add(n+' 0 obj\n'+s+'\nendobj\n')};
 add('%PDF-1.4\n');ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Count '+im.length+'/Kids['+im.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
 im.forEach((m,i)=>{const n=3+3*i,pw=(m.w*.375).toFixed(1),ph=(m.h*.375).toFixed(1),cs='q '+pw+' 0 0 '+ph+' 0 0 cm /I Do Q';
  ob(n,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+pw+' '+ph+']/Resources<</XObject<</I '+(n+2)+' 0 R>>>>/Contents '+(n+1)+' 0 R>>');
  ob(n+1,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
  off[n+2]=len;add((n+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+m.w+'/Height '+m.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+m.d.length+'>>\nstream\n');add(m.d);add('\nendstream\nendobj\n')});
 const N=3+3*im.length,xo=len;let x='xref\n0 '+N+'\n0000000000 65535 f \n';for(let n=1;n<N;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
 add(x+'trailer\n<</Size '+N+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
